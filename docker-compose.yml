services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback-only: reachable from the host for local debugging (psql -h
    # localhost) but never off the box, independent of Security Group rules.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    # Pinned to what "latest" actually resolved to at time of pinning (checked
    # via `docker run --rm --entrypoint sh qdrant/qdrant:latest -c "/qdrant/qdrant --version"`).
    # Do not downgrade below the version that wrote the existing qdrant_data
    # volume — older binaries can't read a newer on-disk storage format.
    # Bump deliberately after checking release notes, not via `docker compose pull`.
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    restart: unless-stopped
    # Loopback-only: the public entry point is nginx's /api/ proxy_pass
    # (frontend/nginx.conf). This binding exists for direct debugging from
    # the host, not for external clients.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      CMS_CONVERSION_FACTOR_2026: ${CMS_CONVERSION_FACTOR_2026:-33.4009}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      POLICIES_DIR: /aarp_policies
    volumes:
      - ./aarp_policies:/aarp_policies:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PATIENT_USERNAME: ${VITE_PATIENT_USERNAME:-patient_demo}
        VITE_PATIENT_PASSWORD: ${VITE_PATIENT_PASSWORD:-patient123}
        VITE_REVIEWER_USERNAME: ${VITE_REVIEWER_USERNAME:-reviewer_demo}
        VITE_REVIEWER_PASSWORD: ${VITE_REVIEWER_PASSWORD:-reviewer123}
        VITE_ADMIN_USERNAME: ${VITE_ADMIN_USERNAME:-admin_demo}
        VITE_ADMIN_PASSWORD: ${VITE_ADMIN_PASSWORD:-admin123}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: nginx only binds 0.0.0.0:80 (no IPv6 listener),
      # but "localhost" resolves to ::1 first in-container, so wget's connection
      # was refused even though nginx was serving fine — falsely "unhealthy".
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  qdrant_data:
