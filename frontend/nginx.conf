server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # nginx's stock mime.types has no entry for .mjs, so pdf.worker.min.mjs
    # (react-pdf's ES module worker, imported via `new URL(...)` in
    # PdfViewer.tsx) is served as application/octet-stream and browsers
    # refuse to load it as a module script — the PDF viewer then hangs on
    # "Loading document..." forever.
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # React Router SPA fallback — any unmatched path serves index.html.
    location / {
        try_files $uri /index.html;
    }
}
